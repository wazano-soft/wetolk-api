[deploy]
# `alembic upgrade head` va encadenado acá (no en preDeployCommand) porque
# Railpack lo ignora -- el build log confirma que el pre-deploy nunca corre.
# alembic es idempotente: si la DB ya está al día, es un no-op; si una
# migración falla, uvicorn no arranca y el deploy queda en rojo (deseado).
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
preDeployCommand = ["alembic upgrade head"]
