name: Supabase Keep-Alive

# Supabase pauses free projects after 7 days without database activity.
# This runs a trivial query once a day to keep the project awake.

on:
  schedule:
    - cron: "17 6 * * *" # daily at ~06:17 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query database
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "select 1;"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
